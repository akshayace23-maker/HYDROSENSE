<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="/js/theme.js"></script>
<title>Log in — HydroSense</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div id="hs-header"></div>
<main>
<div class="auth-wrap">
  <div class="auth-card card">
    <h2>Welcome back</h2>
    <p>Log in to track reports or manage the authority dashboard.</p>
    <div class="tabs" id="tabs" role="tablist">
      <button class="active" data-role="citizen" type="button">Citizen</button>
      <button data-role="authority" type="button">Authority</button>
    </div>
    <div id="alertBox" role="alert"></div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username" maxlength="150">
        <div class="hint" id="emailHint"></div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" maxlength="200">
      </div>
      <button class="btn btn-primary btn-block" type="submit" id="loginBtn">Log in</button>
    </form>
    <p style="margin-top:16px; font-size:0.9rem;">No account? <a href="/register.html" id="signupLink">Sign up</a></p>
  </div>
</div>
</main>
<div id="hs-footer"></div>
<script src="/js/lang/ta.js"></script>
<script src="/js/core.js"></script>
<script src="/js/pages/login.js"></script>
</body>
</html>
